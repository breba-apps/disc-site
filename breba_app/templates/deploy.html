<div class="d-flex flex-column h-100">
    <!-- Input + Button row -->
    <div class="mb-3">
        <label for="sitename" class="form-label">Website Name</label>
        <div class="input-group">
            <input type="text" id="sitename" class="form-control" placeholder="e.g. my-portfolio">
            <button id="deploy-button" class="btn btn-primary">Deploy</button>
        </div>
    </div>

    <!-- Status message -->
    <p id="deploy-status" class="form-text text-muted mt-2">
    </p>

    <!-- List of known deployments -->
    <div id="deploy-list" class="d-flex flex-column gap-2 mt-3"></div>
    <template id="deploy-card-template">
        <div class="card border rounded-3 shadow-sm px-3 py-2" data-id="">
            <a class="fw-medium text-decoration-none text-primary text-break url-link" target="_blank"
               rel="noopener noreferrer"></a>
        </div>
    </template>

    <!-- GitHub Pages section -->
    <hr class="my-3">
    <div id="github-section">
        <h6 class="fw-semibold mb-2">Deploy to GitHub Pages</h6>

        <!-- Not connected state -->
        <div id="github-not-connected">
            <p class="form-text mb-2">Connect your GitHub account to deploy to GitHub Pages.</p>
            <button id="github-connect-btn" class="btn btn-outline-secondary btn-sm">Connect GitHub</button>
        </div>

        <!-- Connected state -->
        <div id="github-connected" class="d-none">
            <p id="github-connected-text" class="form-text text-success mb-2"></p>
            <div class="mb-2">
                <label for="github-org" class="form-label form-label-sm">Organization</label>
                <select id="github-org" class="form-select form-select-sm">
                    <option value="">Select an organization...</option>
                </select>
            </div>
            <button id="github-deploy-btn" class="btn btn-dark btn-sm">Deploy to GitHub Pages</button>
        </div>

        <!-- GitHub deploy status -->
        <p id="github-deploy-status" class="form-text mt-2"></p>
    </div>
</div>

<script>
    const sitenameInput = document.getElementById("sitename");
    const deployButton = document.getElementById("deploy-button");
    const statusText = document.getElementById("deploy-status");

    function autoLink(text) {
        const urlRegex = /(https?:\/\/[^\s]+)/g;
        return text.replace(urlRegex, (url) => {
            return `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`;
        });
    }

    function triggerDeploy() {
        const sitename = sitenameInput.value.trim();
        if (!sitename) {
            statusText.textContent = "Please enter a site name.";
            return;
        }

        statusText.textContent = "Deploying...";
        const chat = document.getElementById('chainlit');
        if (chat) {
            chat.contentWindow.postMessage({
                method: "deploy",
                body: sitename
            }, '*');
        }
    }

    deployButton.addEventListener("click", triggerDeploy);

    sitenameInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
            triggerDeploy();
        }
    });

    // Updates to builder panel
    window.addEventListener('message', (event) => {
        if (event.data.method === "deploy_status") {
            console.log('Deploy status message:', event.data);
            statusText.innerHTML = autoLink(event.data.body);
        } else if (event.data.method === "update_deployments_list") {
            const deployList = document.getElementById("deploy-list");
            const template = document.getElementById("deploy-card-template");

            deployList.innerHTML = "";

            const deployments = event.data.body || [];

            deployments.forEach(({id, url}) => {
                const clone = template.content.cloneNode(true);

                const card = clone.querySelector(".card");
                const urlLink = clone.querySelector(".url-link");
                urlLink.href = url;
                urlLink.textContent = url;

                card.dataset.id = id;

                deployList.appendChild(clone);
            });
        } else if (event.data.method === "github_deploy_status") {
            const result = event.data.body;
            const githubStatus = document.getElementById("github-deploy-status");
            const deployBtn = document.getElementById("github-deploy-btn");
            deployBtn.disabled = false;
            deployBtn.textContent = "Deploy to GitHub Pages";
            if (result.success) {
                githubStatus.innerHTML = `Deployed! Pages URL: <a href="${result.pages_url}" target="_blank" rel="noopener noreferrer">${result.pages_url}</a><br><small class="text-muted">GitHub Pages can take 1–2 minutes to publish.</small>`;
            } else {
                githubStatus.textContent = `Error: ${result.error}`;
            }
        }
    });

    // GitHub connect / deploy logic
    const githubNotConnected = document.getElementById("github-not-connected");
    const githubConnected = document.getElementById("github-connected");
    const githubConnectedText = document.getElementById("github-connected-text");
    const githubOrgSelect = document.getElementById("github-org");
    const githubDeployBtn = document.getElementById("github-deploy-btn");
    const githubConnectBtn = document.getElementById("github-connect-btn");
    const githubDeployStatus = document.getElementById("github-deploy-status");

    async function checkGitHubStatus() {
        try {
            const response = await fetch("/github/status");
            const data = await response.json();
            if (data.connected) {
                await showGitHubConnected(data.github_username);
            } else {
                showGitHubNotConnected();
            }
        } catch (e) {
            showGitHubNotConnected();
        }
    }

    function showGitHubNotConnected() {
        githubNotConnected.classList.remove("d-none");
        githubConnected.classList.add("d-none");
    }

    async function showGitHubConnected(username) {
        githubNotConnected.classList.add("d-none");
        githubConnected.classList.remove("d-none");
        githubConnectedText.textContent = `Connected as @${username}`;
        await loadOrgs();
    }

    async function loadOrgs() {
        try {
            const response = await fetch("/github/orgs");
            const data = await response.json();
            const orgs = data.orgs || [];
            githubOrgSelect.innerHTML = '<option value="">Select an organization...</option>';
            orgs.forEach(org => {
                const option = document.createElement("option");
                option.value = org;
                option.textContent = org;
                githubOrgSelect.appendChild(option);
            });
        } catch (e) {
            console.error("Failed to load GitHub orgs", e);
        }
    }

    githubConnectBtn.addEventListener("click", () => {
        const popup = window.open("/github/connect", "github-connect", "width=600,height=700");
        const poll = setInterval(async () => {
            if (popup && popup.closed) {
                clearInterval(poll);
                await checkGitHubStatus();
            }
        }, 500);
    });

    githubDeployBtn.addEventListener("click", () => {
        const org = githubOrgSelect.value;
        if (!org) {
            githubDeployStatus.textContent = "Please select an organization.";
            return;
        }
        githubDeployStatus.textContent = "";
        githubDeployBtn.disabled = true;
        githubDeployBtn.textContent = "Deploying...";
        const chat = document.getElementById('chainlit');
        if (chat) {
            chat.contentWindow.postMessage({
                method: "deploy_github",
                body: {org}
            }, '*');
        }
    });

    // Check GitHub status on load
    checkGitHubStatus();
</script>
